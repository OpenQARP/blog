# One line per kind of post, shown under the heading of its tag page. Keep in step with the kinds table in README.md.
news: Releases, workshops, talks, events and collaborations.
tutorial: Guides to installing and using the framework.
interview: Conversations with the people who build and use the framework.
use-case: Worked problems from a domain, run as notebooks.
research-radar: Recent algorithms implemented in OpenQARP, run as notebooks.
contribution: PhD-hosted write-ups of work implemented in OpenQARP.
